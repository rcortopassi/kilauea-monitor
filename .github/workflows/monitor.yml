name: Kilauea monitor

on:
  schedule:
    # Pedimos de 5 em 5 min, mas o agendador do GitHub e "melhor esforco".
    # Em 07/2026 disparava ~1x/hora; em 09/2026 caiu para 1 a cada 2-4,5 h.
    # Como cada execucao roda um LACO interno, o laco precisa durar MAIS que o
    # maior intervalo observado, senao sobra janela cega (foi o que atrasou em
    # 71 min a deteccao do episodio 55). Ver o step "Vigiar o vulcao".
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      voltas:
        description: "Voltas do laco de 5 min (padrao 66, ~5,5 h). 1 serve para testar o encadeamento."
        required: false
        default: "66"

permissions:
  contents: write
  actions: write   # para o job encadear o proximo (ver ultimo step)

# Uma execucao nova substitui a anterior: evita fila de jobs de 1 hora
# empilhados e garante que o laco em andamento seja sempre o mais recente.
concurrency:
  group: kilauea-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Vigiar o vulcao (laco de 5 em 5 min por ~5,5 horas)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          PA_TOKEN: ${{ secrets.PA_TOKEN }}
          PA_USER: rafaelcortopassi
        run: |
          git config user.name "kilauea-bot"
          git config user.email "actions@users.noreply.github.com"
          N="${{ inputs.voltas || '66' }}"
          for i in $(seq 1 $N); do
            echo "::group::verificacao $i de $N ($(date -u +%H:%M:%S) UTC)"
            # o job dura horas com o codigo do checkout inicial; sem este pull ele
            # continuaria publicando a versao velha por cima de qualquer commit novo
            git pull -q --rebase 2>/dev/null || { git rebase --abort 2>/dev/null; true; }
            # "|| true": falha de rede numa iteracao nao pode abortar a hora toda
            python3 monitor.py || echo "AVISO: iteracao $i falhou; seguindo"
            # commit a cada iteracao: se esta execucao for cancelada por uma nova,
            # o estado ja gravado nao se perde (evita push duplicado depois)
            if ! git diff --quiet state/; then
              git add state/
              git commit -q -m "estado: $(date -u +%Y-%m-%dT%H:%MZ)"
              git pull -q --rebase && git push -q || echo "AVISO: push do estado falhou"
            fi
            echo "::endgroup::"
            if [ "$i" -lt "$N" ]; then sleep 300; fi
          done

      # O GitHub desliga crons de repositorios sem atividade ha 60 dias.
      # Entre episodios o estado pode ficar semanas sem mudar, entao um
      # commit vazio mensal mantem o agendamento vivo.
      - name: Keepalive (commit vazio se o repo esta parado ha 25+ dias)
        if: always()
        run: |
          ULTIMO=$(git log -1 --format=%ct)
          AGORA=$(date +%s)
          if [ $(( (AGORA - ULTIMO) / 86400 )) -ge 25 ]; then
            git commit --allow-empty -m "keepalive"
            git push
          fi

      # ENCADEAMENTO. O agendador do GitHub chegou a ficar 8 h sem disparar
      # (22-23/11/2026) e o episodio 57 comecou nesse buraco, sem alerta. Um job
      # tem teto de 6 h, entao nenhum laco unico cobre isso. Solucao: ao terminar
      # o laco, o job dispara o proximo. workflow_dispatch e uma das excecoes em
      # que o GITHUB_TOKEN pode iniciar outra execucao. O cron fica so como rede
      # de seguranca, caso a corrente quebre.
      # "!cancelled()": se este job foi cancelado por uma execucao mais nova, NAO
      # encadeia (a nova ja esta vigiando); senao cada cancelamento geraria outro
      # disparo e a corrente viraria um laco de cancela-dispara.
      - name: Encadear a proxima execucao
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run monitor.yml --ref main -R ${{ github.repository }} -f voltas=66
